# node-lint — the readiness flip-gate (WS-NL, node #14).
#
# WHY (Operator-ratified in d-sense, 2026-07-07): status:ready MEANS headless-dispatchable.
# A node labeled ready that fails the readiness contract is self-healed: reverted to
# status:proposed with a comment naming the misses. Policy lives in `bin/ws gate` (single
# home); this workflow is trigger + transport only.
name: node-lint
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      node:
        description: "issue number to gate"
        required: true

permissions:
  issues: write
  contents: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'status:ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: readiness flip-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event_name == 'workflow_dispatch' && inputs.node || github.event.issue.number }}"
          bin/ws gate "$n"
